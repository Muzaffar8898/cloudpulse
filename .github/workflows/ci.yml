name: CloudPulse CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov

      - name: Run tests with coverage
        run: python -m pytest --cov=main --cov=database --cov=analytics --cov-report=term-missing
